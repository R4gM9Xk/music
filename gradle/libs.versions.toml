# 版本目录 —— **只登记本工程真正在用的坐标**（本轮清理 2026-11-10）
#
# ## 上一版是什么，为什么必须改
#
# 旧文件有 129 条（7 个 plugin + 122 个 library），其中 **105 条零引用**：coil、okhttp、
# okio、room×3、hilt×5、dagger×2、navigation×4、fragment、glide、work-runtime、
# material-icons、lifecycle 全套、以及 `[plugins]` 里从未被 apply 的 ksp / hilt /
# kotlin-serialization。文件头当时的自述是「由 APK 内 META-INF/*.version 反查生成，
# 包含全部依赖（含传递依赖），非原始工程的最小直接依赖集」——即它是一份**清单**。
#
# 问题在于它的**形状**与真正的依赖表完全同构：别名是 `androidx-room-compiler`、
# `hilt-compiler` 这种可以直接写进 `implementation(libs.…)` 的形态，而且版本号齐全。
# 于是「照着写就能引」成为这个文件最大的坑：新人（或下一轮模型）看到 `room-ktx = 2.8.5`
# 会以为工程里有 Room，看到 `glance` 会以为小部件走 Glance（实际是纯 RemoteViews，
# 且 MusicWidgetViews.kt 里专门写了一大段「为什么 Glance 在这台机器上编不过」）。
#
# ## 现在的规则
#
# 1. **只放被 `libs.…` 实际引用的条目**。新增依赖时先加这里、再写 `implementation`。
# 2. 传递依赖**不要**登记：Gradle 自己解析，登记进来只会变成「看起来能直接引」的假 API。
# 3. 需要「记录曾经考虑过的方案」时写成注释，不要留一条可用的坐标
#    （glance 的讨论保留在 MusicWidgetViews.kt 的类注释里，那才是它该在的地方）。
#
# 若确实需要旧清单做考古，`docs/03-依赖清单.md` 是它的来源文档。

[versions]
agp                    = "8.13.0"   # 推测：compileSdk 36 需 AGP 8.9+
kotlin                 = "2.2.20"   # 反查自 KotlinVersionCurrentValue
haze                   = "1.6.10"   # 背景真模糊（1.7+ 需 compileSdk 37，本工程锁 36）
# ksp / hilt 只服务根脚本里那两个 `apply false` 的插件声明（无人 apply）。
# 版本号必须留在版本目录里，否则 `version.ref` 解析失败同样会让脚本编译不过。
ksp                    = "2.2.20-2.0.4"
hilt                   = "2.57.2"
compileSdk             = "36"
minSdk                 = "35"
targetSdk              = "36"

[plugins]
# 四个实际 apply 的插件（见各模块 build.gradle.kts）。
# **另外三个（ksp / hilt / kotlin-serialization）在根 build.gradle.kts 里以
# `apply false` 声明** —— 它们不参与任何模块的构建，但根脚本持有这些 alias，
# 删掉会导致「Unresolved reference: serialization / ksp / hilt」脚本编译失败
# （本轮改这一版时实际踩到了这个坑）。保留它们，但**不要**在任何模块里 apply：
# 本工程没有 KSP 处理器、没有 Hilt 组件、也没有 @Serializable。
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library", version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
# ── AndroidX / Compose ──────────────────────────────────────────────
activity                  = { module = "androidx.activity:activity", version = "1.12.4" }
activity-compose          = { module = "androidx.activity:activity-compose", version = "1.12.4" }
ui                        = { module = "androidx.compose.ui:ui", version = "1.10.0" }
ui-graphics               = { module = "androidx.compose.ui:ui-graphics", version = "1.10.0" }
foundation                = { module = "androidx.compose.foundation:foundation", version = "1.10.0" }
material3                 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
# material（非 material3）：目前只用到 `androidx.compose.material` 的图标/兼容面，
# 与 material3 并存是既有状态（Compose 官方也允许两者同时存在）。
material                  = { module = "androidx.compose.material:material", version = "1.10.0" }
palette                   = { module = "androidx.palette:palette", version = "1.0.0" }

# ── 播放 / 媒体会话 ─────────────────────────────────────────────────
media                     = { module = "androidx.media:media", version = "1.7.0" }
media3-exoplayer          = { module = "androidx.media3:media3-exoplayer", version = "1.11.1" }
media3-session            = { module = "androidx.media3:media3-session", version = "1.11.1" }

# ── 持久化 / 协程 / 模糊 ────────────────────────────────────────────
datastore                 = { module = "androidx.datastore:datastore", version = "1.2.1" }
datastore-preferences     = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
kotlin-stdlib             = { module = "org.jetbrains.kotlin:kotlin-stdlib", version = "2.2.20" }
haze                      = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# ── 测试 ────────────────────────────────────────────────────────────
junit                     = { module = "junit:junit", version = "4.13.2" }
kotlinx-coroutines-test   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.11.0" }
